name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---- Frontend (repo root) ----
      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend type check
        run: npm run typecheck

      - name: Frontend build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # ---- Engine (server) ----
      - name: Install engine dependencies
        run: npm ci
        working-directory: server

      - name: Engine type check
        run: npm run typecheck
        working-directory: server

      - name: Engine tests
        run: npm run test
        working-directory: server

      - name: Engine build
        run: npm run build
        working-directory: server
